name: Validate static site

on:
  push:
    branches: [main]
  pull_request:

# Minimal permissions: only read repo contents.
# No write, no id-token, no packages access.
permissions:
  contents: read

env:
  # Suppress verbose runner debug output that could accidentally expose
  # environment variables or secret names in logs.
  ACTIONS_STEP_DEBUG: false
  ACTIONS_RUNNER_DEBUG: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout pinned to commit SHA for v4.2.2
      # Prevents tag-mutation supply-chain attacks (a bad actor re-pointing @v4).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # actions/setup-node pinned to commit SHA for v4.2.0
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e  # v4.2.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
